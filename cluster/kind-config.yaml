# kind cluster tanımı: tek node'lu "k8s-cicd" cluster'ı.
# Host makinedeki 80 portu, node'un 80 portuna bağlanır. Traefik bu porta hostPort ile
# oturduğu için tarayıcıdan http://localhost doğrudan Gateway'e ulaşır.
# Node imajı sabitlenmiştir (latest yok): Kubernetes v1.37.0, kind v0.33.0 ile uyumlu.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-cicd
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      # http://localhost:80 -> node:80 -> Traefik (hostPort: 80)
      - containerPort: 80
        hostPort: 80
        protocol: TCP
