# /api/products ile başlayan istekleri product-service:8080'e yönlendirir.
# Ek kural: /info/products -> product-service'in /api/info ucu (URLRewrite ile yol değiştirilir).
# Canlıda yeni sürümün geldiğini dışarıdan göstermek için: curl http://localhost/info/products
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: product-route
spec:
  parentRefs:
    - name: demo-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/products
      backendRefs:
        - name: product-service
          port: 8080
    # /info/products (birebir) -> product-service'e giderken yol /api/info olarak yeniden yazılır
    - matches:
        - path:
            type: Exact
            value: /info/products
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /api/info
      backendRefs:
        - name: product-service
          port: 8080
