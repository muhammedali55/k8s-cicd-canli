# PostgreSQL için headless Service (clusterIP: None).
# StatefulSet pod'una sabit bir DNS adı verir: servisler "postgres:5432" adresiyle bağlanır.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
