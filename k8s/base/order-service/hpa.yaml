# order-service için HorizontalPodAutoscaler.
# Ortalama CPU kullanımı, isteğin (requests.cpu) %70'ini geçerse replika sayısı 5'e kadar artar.
# CPU ölçümü için cluster'da metrics-server gerekir (cluster/setup-cluster.sh kurar).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
