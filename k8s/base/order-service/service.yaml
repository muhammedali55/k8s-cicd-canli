# order-service için ClusterIP Service: cluster içinden "order-service:8080" adresiyle erişilir.
# HTTPRoute da trafiği bu Service'e yönlendirir.
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8080
      targetPort: http
