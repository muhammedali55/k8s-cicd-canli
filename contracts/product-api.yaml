# product-service HTTP sözleşmesi (OpenAPI 3.1).
# product-service bu uçları sunar; order-service bu uçları çağırır.
# İki ajan birbirinin kodunu görmeden, yalnızca bu dosyaya bakarak çalışır.
# Bu dosya değiştirilmez; hata olduğunu düşünen ajan raporunda belirtir.
openapi: 3.1.0

info:
  title: product-service API
  version: 0.1.0
  description: |
    Ürünleri listeleyen, oluşturan ve stok düşüren servis.
    Hata yanıtları RFC 9457 ProblemDetail formatındadır (`application/problem+json`).

servers:
  - url: http://localhost:8081
    description: Lokal geliştirme (IDE / docker run)
  - url: http://product-service:8080
    description: Kubernetes içinden (order-service buradan çağırır)
  - url: http://localhost
    description: Cluster dışından, Gateway üzerinden

tags:
  - name: products
    description: Ürün işlemleri

paths:
  /api/products:
    get:
      tags: [products]
      operationId: listProducts
      summary: Tüm ürünleri listeler
      responses:
        "200":
          description: Ürün listesi (ürün yoksa boş dizi)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
              example:
                - id: 1
                  name: Klavye
                  price: 750.00
                  stock: 10
                - id: 2
                  name: Mouse
                  price: 350.00
                  stock: 25
                - id: 3
                  name: Monitör
                  price: 5200.00
                  stock: 5

    post:
      tags: [products]
      operationId: createProduct
      summary: Yeni ürün oluşturur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
            example:
              name: Kulaklık
              price: 1200.00
              stock: 8
      responses:
        "201":
          description: Ürün oluşturuldu
          headers:
            Location:
              description: Oluşan ürünün adresi
              schema:
                type: string
              example: /api/products/4
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
              example:
                id: 4
                name: Kulaklık
                price: 1200.00
                stock: 8
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/products/{id}:
    get:
      tags: [products]
      operationId: getProduct
      summary: Tek ürünü getirir
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Ürün bulundu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
              example:
                id: 1
                name: Klavye
                price: 750.00
                stock: 10
        "404":
          $ref: "#/components/responses/ProductNotFound"

  /api/products/{id}/decrease-stock:
    post:
      tags: [products]
      operationId: decreaseStock
      summary: Ürünün stoğunu verilen miktar kadar düşürür
      description: |
        order-service, sipariş oluştururken bu ucu çağırır.
        Stok yetmezse hiçbir şey değişmez ve 409 döner.
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecreaseStockRequest"
            example:
              quantity: 2
      responses:
        "200":
          description: Stok düşürüldü; ürünün güncel hâli döner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
              example:
                id: 1
                name: Klavye
                price: 750.00
                stock: 8
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "409":
          description: Stok yetersiz
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: "Yetersiz stok: ürün 1 için istenen 20, mevcut 10"
                instance: /api/products/1/decrease-stock

components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Ürün kimliği
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

  schemas:
    Product:
      type: object
      description: Ürünün dışarıya gösterilen hâli
      required: [id, name, price, stock]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Klavye
        price:
          type: number
          description: Birim fiyat (BigDecimal), 0'dan büyük
          exclusiveMinimum: 0
          example: 750.00
        stock:
          type: integer
          format: int32
          minimum: 0
          example: 10

    CreateProductRequest:
      type: object
      description: Yeni ürün oluşturma gövdesi
      required: [name, price, stock]
      properties:
        name:
          type: string
          minLength: 1
          example: Kulaklık
        price:
          type: number
          exclusiveMinimum: 0
          example: 1200.00
        stock:
          type: integer
          format: int32
          minimum: 0
          example: 8

    DecreaseStockRequest:
      type: object
      description: Stok düşürme gövdesi
      required: [quantity]
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
          example: 2

    ProblemDetail:
      type: object
      description: RFC 9457 hata gövdesi (Spring `ProblemDetail`)
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: "Ürün bulunamadı: 99"
        instance:
          type: string
          example: /api/products/99
      additionalProperties: true

  responses:
    ProductNotFound:
      description: Ürün bulunamadı
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: "Ürün bulunamadı: 99"
            instance: /api/products/99

    ValidationError:
      description: Gövde doğrulamadan geçemedi
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: "price: 0'dan büyük olmalı"
            instance: /api/products
